x-db-common: &db-common
  image: postgres:16.1
  networks:
    - ewm-network

services:
  event-db:
    <<: *db-common
    container_name: event-db
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d event_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  request-db:
    <<: *db-common
    container_name: request-db
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - request_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d request_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    <<: *db-common
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rating-db:
    <<: *db-common
    container_name: rating-db
    environment:
      POSTGRES_DB: rating_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5435:5432"
    volumes:
      - rating_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-db:
    <<: *db-common
    container_name: stats-db
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "6542:5432"
    volumes:
      - stats_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  ewm-db:
    <<: *db-common
    container_name: ewm-db
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "6543:5432"
    volumes:
      - ewm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ewm"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation-db:
    <<: *db-common
    container_name: recommendation-db
    environment:
      POSTGRES_DB: recommendation_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5436:5432"
    volumes:
      - recommendation_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d recommendation_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'EWM-2024-KAFKA-CLUSTER'
    networks:
      - ewm-network

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 3 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 3 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true
    networks:
      - ewm-network

volumes:
  event_data:
  request_data:
  user_data:
  rating_data:
  stats_data:
  ewm_data:
  recommendation_data:

networks:
  ewm-network:
    driver: bridge