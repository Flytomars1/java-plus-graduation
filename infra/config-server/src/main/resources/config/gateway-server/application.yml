server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/categories/**, /compilations/**, /events/**, /admin/categories/**, /admin/compilations/**, /admin/events/**, /users/*/events, /users/*/events/**
          filters:
            - StripPrefix=0

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests, /users/*/requests/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=0

        - id: rating-service
          uri: lb://rating-service
          predicates:
            - Path=/ratings/**, /users/*/ratings/**
          filters:
            - StripPrefix=0

          #id: main-service
          #uri: lb://main-service
          #predicates:
          #  - Path=/**
          #filters:
          # - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG