syntax = "proto3";

package ru.practicum.recommendation.proto;

option java_package = "ru.practicum.recommendation.proto";
option java_multiple_files = true;
option java_outer_classname = "RecommendationServiceProto";

// Messages
message UserPredictionsRequest {
  int64 user_id = 1;
  int32 max_results = 2;
}

message SimilarEventsRequest {
  int64 event_id = 1;
  int64 user_id = 2;
  int32 max_results = 3;
}

message InteractionsCountRequest {
  repeated int64 event_ids = 1;
}

message RecommendedEvent {
  int64 event_id = 1;
  double score = 2;
}

message UserAction {
  int64 user_id = 1;
  int64 event_id = 2;
  ActionType action_type = 3;
  int64 timestamp = 4;
}

enum ActionType {
  ACTION_VIEW = 0;
  ACTION_REGISTER = 1;
  ACTION_LIKE = 2;
}

message Empty {}

// Services
service RecommendationsService {
  rpc GetRecommendationsForUser(UserPredictionsRequest) returns (stream RecommendedEvent);
  rpc GetSimilarEvents(SimilarEventsRequest) returns (stream RecommendedEvent);
  rpc GetInteractionsCount(InteractionsCountRequest) returns (stream RecommendedEvent);
}

service UserActionService {
  rpc CollectUserAction(UserAction) returns (Empty);
}